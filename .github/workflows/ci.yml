name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analizar-y-probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  apk:
    needs: analizar-y-probar
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Preparar la llave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.ASISTENTE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/asistente.jks"
            echo "ASISTENTE_KEYSTORE=$RUNNER_TEMP/asistente.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Sin llave propia: el APK se firma con una llave temporal y no podrá actualizar una instalación anterior."
          fi
      - name: Armar el APK
        env:
          ASISTENTE_KEYSTORE_PASSWORD: ${{ secrets.ASISTENTE_KEYSTORE_PASSWORD }}
          ASISTENTE_KEY_ALIAS: asistente
        run: flutter build apk --release --build-number "${{ github.run_number }}"
      - run: cp build/app/outputs/flutter-apk/app-release.apk asistente.apk
      - uses: actions/upload-artifact@v4
        with:
          name: asistente-apk
          path: asistente.apk
      - name: Publicar para descargar desde el celular
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ultima --yes --cleanup-tag || true
          gh release create ultima asistente.apk \
            --target "${{ github.sha }}" \
            --title "Última versión (compilación ${{ github.run_number }})" \
            --notes "Descarga asistente.apk desde el celular y ábrelo para instalar."
